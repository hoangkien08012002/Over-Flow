name: build-and-test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore OrderFlow.sln
      - name: Build
        run: dotnet build OrderFlow.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test OrderFlow.sln --no-build --configuration Release
      - name: Validate Compose
        run: docker compose --env-file .env.example config --quiet
